<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Currency Converter</span>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="container">

        <div class="row mb-4">
            <div class="col-md-8">
                <h2>Convert Currency</h2>
            </div>
        </div>

        <!-- CARD -->
        <div class="card p-4">

            <div class="row g-3">

                <!-- AMOUNT -->
                <div class="col-md-4">
                    <input type="number" id="amount" class="form-control" placeholder="Enter amount (USD)">
                </div>

                <!-- DATE -->
                <div class="col-md-4">
                    <input type="date" id="date" class="form-control">
                </div>

                <!-- BUTTON -->
                <div class="col-md-4">
                    <button id="convertBtn" class="btn btn-primary w-100">
                        Convert
                    </button>
                </div>

            </div>

            <!-- RESULT -->
            <div class="mt-4">
                <h5 id="result" class="text-success"></h5>
            </div>

        </div>

    </div>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- JS -->
    <script src="scripts/classwork.js"></script>

</body>
</html>
